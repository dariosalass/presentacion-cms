<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Gestores de contenido o CMS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0a1f;--card:#1a1233;--ln:#3a2a66;--bl:#a78bff;--gr:#ff6b9d;--or:#ffc857;--tx:#f6f1ff;--mu:#b0a5cf;--f:'Outfit',Arial,sans-serif;--m:'DM Mono',Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07040f;overflow:hidden;font-family:var(--f);color:var(--tx)}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#st{position:absolute;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:radial-gradient(1100px 800px at 12% 105%,#2b1259,var(--bg))}
#cv{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 2px,transparent 2px);background-size:64px 64px}
.s{position:absolute;inset:0;padding:110px 128px 120px;display:flex;flex-direction:column;gap:40px;visibility:hidden}
.s.on{visibility:visible;z-index:2}
.s.out{visibility:visible;z-index:1;animation:out .7s cubic-bezier(.7,0,.3,1) both}
@keyframes out{to{opacity:0;transform:translateY(-90px) scale(.94);filter:blur(12px)}}
.s.on{animation:inn .8s cubic-bezier(.16,1,.3,1) both}
@keyframes inn{from{opacity:0;transform:translateY(90px) scale(.96);filter:blur(12px)}}
.a{opacity:0}
.s.on .a{animation:up .9s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(.35s + var(--i,0)*.12s)}
.s.on .a.l{animation-name:lf}.s.on .a.z{animation-name:zm}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1}}
@keyframes lf{from{opacity:0;transform:translateX(-90px)}to{opacity:1}}
@keyframes zm{from{opacity:0;transform:scale(.6)}to{opacity:1}}
h1{font-size:176px;line-height:1;font-weight:700;letter-spacing:-3px}
h2{font-size:76px;font-weight:700;line-height:1.1;letter-spacing:-1px}
h3{font-size:38px;font-weight:700;line-height:1.15}
p{font-size:28px;color:var(--mu);line-height:1.4}
.m{font-family:var(--m);color:var(--gr);font-size:28px}
.bar{flex-shrink:0;display:block;width:150px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bl),var(--gr),var(--or));transform-origin:0 0;margin-top:-14px}
.s.on .bar{animation:bar 1s .5s cubic-bezier(.16,1,.3,1) both}
@keyframes bar{from{transform:scaleX(0)}}
.ch{display:inline-block;opacity:0}
.s.on .ch{animation:ch .8s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(.4s + var(--j)*.06s)}
@keyframes ch{from{opacity:0;transform:translateY(80px) rotate(8deg);filter:blur(12px)}to{opacity:1}}
.c{background:rgba(26,18,51,.88);border:1px solid var(--ln);border-left:7px solid var(--bl);border-radius:16px;padding:34px 38px;display:flex;flex-direction:column;gap:14px}
.g{display:grid;gap:36px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
ul{list-style:none;display:flex;flex-direction:column;gap:14px;font-size:30px}
li::before{content:"◆";font-size:.55em;vertical-align:middle;color:var(--gr);margin-right:16px}
.big{font-size:104px;font-weight:700;color:var(--gr);line-height:1}
.num{font-size:84px;font-weight:700;color:var(--bl);line-height:1}
.chip{font-family:var(--m);font-size:28px;padding:10px 18px;border-radius:999px;background:#150d2b;border:1px solid var(--ln);width:max-content;max-width:100%}
.warn{border-color:var(--or);animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{box-shadow:0 0 50px rgba(255,169,77,.3)}}
.s.on .warn.a{animation:up .9s cubic-bezier(.16,1,.3,1) both,pu 2.4s 1.5s ease-in-out infinite;animation-delay:calc(.35s + var(--i)*.12s),0s}
.logo{position:absolute;width:460px;height:460px;object-fit:contain;animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-22px)}}
.ring{position:absolute;border-radius:50%;border:3px dashed rgba(255,107,157,.55);animation:sp 26s linear infinite}.ring::after{content:"";position:absolute;top:-15px;left:calc(50% - 15px);width:30px;height:30px;border-radius:50%;background:var(--gr);box-shadow:0 0 30px var(--gr)}.ring2{position:absolute;border-radius:50%;border:3px dotted rgba(255,200,87,.6);animation:sp 18s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}
.term{background:#04070c;border:1px solid var(--ln);border-radius:22px;overflow:hidden;font-family:var(--m);font-size:29px;line-height:1.55}
.tb{display:flex;gap:12px;align-items:center;padding:18px 26px;background:#0b1320;color:var(--mu);font-size:24px}
.tb i{width:16px;height:16px;border-radius:50%;background:#ff5f57}.tb i:nth-child(2){background:#febc2e}.tb i:nth-child(3){background:#28c840;margin-right:14px}
.tbody{padding:28px 36px;min-height:600px}.ln{white-space:pre;min-height:45px}.cm{color:var(--mu)}.pr{color:var(--gr)}
.cu{display:inline-block;width:14px;height:28px;background:var(--gr);vertical-align:-4px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.sp .c{transition:all .5s}.sp .c.hl{border-color:var(--gr);box-shadow:0 0 40px rgba(61,220,151,.25);background:#10261f}.sp .c.hl .num{color:var(--gr)}
#pg{position:absolute;left:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--bl),var(--gr));transition:width .7s cubic-bezier(.16,1,.3,1);z-index:9}
#ct{position:absolute;right:128px;bottom:36px;font:24px var(--m);color:var(--mu);z-index:9}
#nt{position:absolute;left:0;right:0;bottom:0;padding:28px 128px 40px;background:rgba(3,6,11,.94);font-size:30px;line-height:1.5;z-index:10;display:none}
</style></head><body><div id="st"><canvas id="cv" width="1920" height="1080"></canvas><div id="sl"></div><div id="pg"></div><div id="ct"></div><div id="nt"></div></div>
<script>
const NOTES=["Buenas. Hoy vamos a hablar de los gestores de contenido o CMS: qué son, qué tipos hay y cómo elegir el adecuado.", "Un CMS es una aplicación para crear, administrar y publicar contenido web sin saber programar. Antes había que escribir HTML, CSS o PHP; ahora se hace con paneles y editores visuales.", "Las ventajas: son fáciles de usar, ahorran costes y tiempo, tienen muchas plantillas, gestionan usuarios y permisos, se actualizan en seguridad y escalan. Los más conocidos: WordPress, Joomla, Drupal, Moodle y PrestaShop.", "Por licencia hay tres tipos. Código abierto: gratis y modificable, pero tú te encargas de la seguridad. Propietarios: de pago, con soporte oficial, pero dependes del proveedor. En la nube: el proveedor aloja y mantiene todo por una suscripción.", "Por su uso se dividen en cuatro familias: tiendas online, formación online, corporativos y blogs. Ahora vemos cada una con sus CMS principales.", "E-commerce: traen catálogo, inventario, carrito, pagos, pedidos y facturas. PrestaShop es para pymes, Magento para empresas grandes, WooCommerce es un plugin de WordPress y Shopify va en la nube.", "Nuestra valoración en e-commerce. Con más posibilidades gratis gana Magento, aunque PrestaShop es el mejor equilibrio para una pyme. En costes ocultos destacan Shopify y WooCommerce, y la mejor interfaz es la de Shopify, la más intuitiva.", "E-learning, o LMS: sirven para dar cursos online con tareas, exámenes, foros y certificados. Moodle es el más usado, Chamilo es más sencillo, Open edX es para cursos masivos y Canvas es muy común en universidades.", "En e-learning, Moodle es el más completo y gratuito, y Open edX es muy potente pero exige servidores. Los costes ocultos están en Open edX por la infraestructura y en Canvas por la suscripción de la nube. La mejor interfaz es la de Canvas.", "Los corporativos están pensados para organizaciones grandes: permisos avanzados, alta seguridad y varios sitios en una plataforma. Drupal es el más potente, Joomla es el término medio y Liferay se usa para intranets.", "Entre los corporativos, Drupal es el más potente y flexible. Liferay tiene la edición empresarial de pago, y Joomla es el más fácil de usar de los tres.", "Los de blogs priorizan publicar rápido: editor visual, categorías, comentarios y SEO. WordPress es la referencia, Blogger es gratis de Google y Ghost es minimalista y centrado en newsletters.", "En blogs, WordPress tiene más posibilidades gratuitas por sus plugins, aunque los premium y la seguridad suman costes. Ghost es la más limpia y minimalista, y Blogger casi no tiene costes pero es muy básico.", "Para elegir hay que mirar nueve criterios: tipo de proyecto, requisitos del servidor, facilidad de uso, seguridad, escalabilidad, extensibilidad, comunidad, licencia y coste, y SEO e idiomas.", "Conclusión: no hay un CMS mejor en términos absolutos. La mejor opción es la que encaja con los objetivos, los recursos técnicos y el presupuesto. Muchas gracias, ¿alguna pregunta?"],LOGO='';let n=0;
const A=(c='')=>`class="a ${c}" style="--i:${n++}"`,H=t=>{n=0;return `<h2 ${A()}>${t}</h2><i class="bar"></i>`};
const L=(t,s='')=>[...t].map((c,i)=>c==' '?' ':`<span class="ch" style="--j:${i}">${c}</span>`).join('');
const card=(t,b,c='c l')=>`<div ${A(c)}><h3>${t}</h3><p>${b}</p></div>`;
const lis=a=>a.map(x=>`<li ${A()}>${x}</li>`).join('');
const term=(t)=>`<div ${A('term z')}><div class="tb"><i></i><i></i><i></i>kali@kali: ~</div><div class="tbody" id="tm"></div></div>`;
const steps=a=>`<div class="sp" style="display:flex;flex-direction:column;gap:28px;justify-content:center">${a.map((t,i)=>`<div ${A('c')} data-k="${i}" style="flex-direction:row;align-items:center;gap:26px"><div class="num">${i+1}</div><p style="color:var(--tx)">${t}</p></div>`).join('')}</div>`;
const sub=t=>`<p ${A('l')} style="margin-top:-24px">${t}</p>`;
const chips=a=>`<div style="display:flex;flex-wrap:wrap;gap:12px">${a.map(x=>`<div ${A('chip')} style="font-family:var(--f);font-size:26px">${x}</div>`).join('')}</div>`;
const mini=(t,b,c='c z',col='var(--bl)')=>`<div ${A(c)}><h3 style="color:${col};font-size:34px">${t}</h3><p style="font-size:26px">${b}</p></div>`;
const uso=(t,s,lab,ch,cards,cl)=>H(t)+sub(s)+`<div style="display:grid;grid-template-columns:1fr 1.5fr;gap:36px;flex:1"><div ${A('c l')} style="align-self:start"><span class="m">${lab}</span>${chips(ch)}</div><div class="g ${cl}" style="align-content:start;${cl?'':'grid-template-columns:1fr'}">${cards.map((x,i)=>mini(x[0],x[1],i%2?'c z':'c l')).join('')}</div></div>`;
const ring=(r,tp,sz,fs)=>`<div class="ring" style="right:${r}px;top:${tp}px;width:${sz}px;height:${sz}px"></div><div class="ring2" style="right:${r+sz*.12}px;top:${tp+sz*.12}px;width:${sz*.76}px;height:${sz*.76}px"></div><div class="a z" style="--i:3;position:absolute;right:${r}px;top:${tp}px;width:${sz}px;height:${sz}px;display:flex;align-items:center;justify-content:center"><div style="font-size:${fs}px;font-weight:700;color:var(--tx);text-shadow:0 0 60px rgba(255,107,157,.6);animation:fl 5s ease-in-out infinite">CMS</div></div>`;
const SL=[
{h:()=>{n=0;return ring(150,250,560,170)+`<div style="margin-top:150px"><p ${A('l m')}>UT03 · IMPLANTACIÓN DE APLICACIONES WEB</p><h1 style="font-size:150px;margin:18px 0 10px">${L('Gestores de')}<br><span style="color:var(--gr)">${L('contenido')}</span></h1><h3 ${A()} style="font-size:54px;font-weight:500;color:var(--bl)">CMS · Content Management System</h3></div><div style="margin-top:auto"><p ${A()} style="font-size:32px">ASIR 2º · Digitech FP</p><p ${A()} style="font-size:34px;color:var(--tx);margin-top:10px">Grupo 4</p></div>`}},
{h:()=>H('¿Qué es un CMS?')+`<div ${A('c l')}><span class="m">DEFINICIÓN</span><p style="font-size:32px;color:var(--tx)">Una aplicación que permite crear, administrar y publicar contenidos digitales en un sitio web sin necesidad de conocimientos avanzados de programación.</p></div><div class="g g3">${[['Crear','Páginas, noticias, productos o cursos online.'],['Administrar','Contenido, usuarios y permisos desde un panel.'],['Publicar','Directamente en Internet con un editor visual.']].map((x,i)=>mini(x[0],x[1],'c z','var(--gr)')).join('')}</div><div ${A('c l')} style="flex-direction:row;align-items:center;gap:30px;border-color:var(--gr)"><p style="color:var(--mu);font-size:30px">Antes: <b style="color:var(--or)">HTML, CSS, PHP</b></p><span class="m" style="font-size:44px">→</span><p style="color:var(--tx);font-size:30px">Ahora: <b style="color:var(--gr)">formularios, paneles y editores visuales</b></p></div>`},
{h:()=>H('Ventajas de usar un CMS')+`<div class="g g3">${[['Facilidad de uso','Sin programar para gestionar la web.'],['Menos costes y tiempo','El desarrollo se reduce mucho.'],['Plantillas y complementos','Gran cantidad para elegir.'],['Usuarios y permisos','Cada persona con su rol.'],['Seguridad','Actualizaciones periódicas.'],['Escalabilidad','Se adapta a distintos proyectos.']].map((x,i)=>mini(`<span class="m" style="display:block;font-size:24px">0${i+1}</span>${x[0]}`,x[1],['c l','c','c z'][i%3])).join('')}</div><div ${A('c z')} style="margin-top:auto"><span class="m">LOS MÁS CONOCIDOS</span>${chips(['WordPress','Joomla','Drupal','Moodle','PrestaShop'])}</div>`},
{h:()=>H('CMS según su licencia')+`<div class="g g3" style="flex:1">${[['Código abierto','Código público: se puede estudiar y modificar.',['Licencia gratuita (GPL)','Comunidad y plugins enormes','Se instala en tu servidor','Seguridad a cargo del usuario'],['WordPress','Joomla','Drupal'],'var(--gr)'],['Propietarios','Código cerrado, con pago de licencia.',['Soporte técnico oficial','Alta fiabilidad','Poca personalización','Dependes del proveedor'],['Adobe EM','Sitecore','Kentico'],'var(--or)'],['En la nube','Alojados en servidores remotos.',['Acceso desde el navegador','Sin instalar nada','El proveedor mantiene todo','Suscripción mensual o anual'],['Shopify','Blogger'],'var(--bl)']].map((x,i)=>`<div ${A(['c l','c','c z'][i])} style="border-color:${x[4]}"><h3 style="color:${x[4]};font-size:46px">${x[0]}</h3><p style="font-size:31px">${x[1]}</p><ul style="font-size:31px;gap:18px">${lis(x[2])}</ul>${chips(x[3])}</div>`).join('')}</div>`},
{h:()=>H('CMS según su uso')+`<div class="g g2" style="flex:1">${[['E-commerce','Tiendas online: catálogo, pagos y pedidos.',['PrestaShop','Magento','WooCommerce','Shopify']],['E-learning','LMS: cursos y seguimiento del alumnado.',['Moodle','Chamilo','Open edX','Canvas']],['Corporativos','Empresas y administraciones con mucho contenido.',['Drupal','Joomla','Liferay']],['Blogs e informativos','Publicar artículos y noticias rápido.',['WordPress','Blogger','Ghost']]].map((x,i)=>`<div ${A(i%2?'c z':'c l')}><span class="m">0${i+1}</span><h3 style="font-size:46px">${x[0]}</h3><p style="font-size:30px">${x[1]}</p>${chips(x[2])}</div>`).join('')}</div>`},
{h:()=>uso('E-commerce','Diseñados para crear, administrar y mantener tiendas online.','FUNCIONES',['Catálogo de productos','Inventario y stock','Carrito de compra','Pasarelas de pago','Pedidos y envíos','Descuentos y cupones','Facturas automáticas','SEO y estadísticas'],[['PrestaShop','Código abierto, muy popular en Europa. Ideal para pymes.'],['Magento','Para empresas grandes. Escalable, pero exige servidores potentes.'],['WooCommerce','Plugin de WordPress que lo convierte en tienda. Bajo coste.'],['Shopify','En la nube con hosting incluido. Pago por suscripción.']],'g2')},
{h:()=>uso('E-learning','También llamados LMS (Learning Management System).','FUNCIONES',['Cursos por módulos','Roles: admin, profesor, alumno','Cuestionarios y tareas','Foros y chats','Seguimiento del progreso','Certificados','Videoconferencias','Estándar SCORM'],[['Moodle','El LMS libre más usado del mundo (GPL, PHP). Compleja de administrar.'],['Chamilo','Libre, derivado de Dokeos. Más sencillo, con menos extensiones.'],['Open edX','Creado por Harvard y MIT para cursos masivos (MOOC).'],['Canvas LMS','Interfaz moderna, muy usada en universidades. Versión libre y en la nube.']],'g2')},
{h:()=>uso('CMS corporativos','Para empresas e instituciones que gestionan mucha información.','FUNCIONES',['Usuarios y permisos avanzados','Administración centralizada','Alta seguridad','Varios sitios en una plataforma','Integración empresarial','Colaboración entre departamentos'],[['Drupal','Libre, muy potente y seguro. Para grandes organizaciones y administraciones públicas.'],['Joomla','Equilibrio entre facilidad y funciones. Webs corporativas medianas.'],['Liferay','Especializado en portales e intranets. Muy usado en grandes empresas.']],'')},
{h:()=>uso('Blogs y sitios informativos','Publicar de forma periódica, rápido y sin conocimientos técnicos.','FUNCIONES',['Editor visual','Categorías y etiquetas','Programar publicaciones','Comentarios y moderación','Varios autores','SEO','RSS y newsletter','Redes sociales'],[['WordPress','El CMS más popular del mundo (PHP y MySQL). Miles de plugins y excelente SEO.'],['Blogger','Gratuito de Google, en la nube. Poca personalización.'],['Ghost','Libre en Node.js, rápido y minimalista. Newsletters de pago integradas.']],'')},
{h:()=>H('¿Qué CMS elegir?')+`<div class="g g3">${[['Tipo de proyecto','Cada CMS tiene su uso'],['Requisitos del servidor','Lenguaje, BBDD y servidor web'],['Facilidad de uso','Panel intuitivo'],['Seguridad','Actualizaciones, SSL, copias'],['Escalabilidad','Visitas, contenido y caché'],['Extensibilidad','Plugins, módulos, plantillas'],['Comunidad y soporte','Documentación y foros'],['Licencia y coste','Hosting, plugins, mantenimiento'],['SEO y multidioma','Posicionamiento e idiomas']].map((x,i)=>mini(`<span class="m" style="font-size:22px">0${i+1}</span> ${x[0]}`,x[1],['c l','c','c z'][i%3]).replace('font-size:34px','font-size:30px').replace('font-size:26px','font-size:24px')).join('')}</div>`},
{h:()=>H('Conclusión')+`<div ${A('c l')} style="width:1100px"><p style="font-size:38px;color:var(--tx)">No existe un CMS mejor que otro en términos absolutos: la mejor opción es la que se adapta a los <b style="color:var(--gr)">objetivos</b>, los <b style="color:var(--bl)">recursos técnicos</b> y el <b style="color:var(--or)">presupuesto</b> del proyecto.</p></div>${ring(150,500,400,115)}<h1 style="font-size:110px;color:var(--or);margin-top:auto">${L('Muchas gracias')}</h1><h3 ${A()} style="font-size:56px;color:var(--bl)">¿Preguntas?</h3>`}
];
